<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduGest · Sistema de Gestión Institucional</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- INICIO DE SESIÓN -->
<section id="login" hidden>
  <form id="formLogin" class="login-card">
    <div class="logo-grande"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
    <h1>EduGest</h1>
    <p class="muted">Sistema de Gestión Institucional</p>
    <label>Correo
      <input name="correo" type="email" required autocomplete="username" placeholder="nombre@correo.com">
    </label>
    <label>Contraseña
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <p id="loginErr" class="err" hidden></p>
    <button class="btn">Iniciar sesión</button>
    <small class="muted">Las cuentas las crea el administrador de la institución.</small>
  </form>
</section>

<!-- APLICACIÓN -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
      <div><b>EduGest</b><small>Sistema de Gestión Institucional</small></div>
    </div>
    <nav id="menu"></nav>
    <div class="user">
      <div class="avatar" id="av"></div>
      <div><b id="uNombre"></b><small id="uRol"></small></div>
    </div>
    <button id="salir" class="salir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Cerrar sesión
    </button>
  </aside>

  <div class="content">
    <header class="top">
      <span id="fecha"></span>
      <span class="periodo" id="periodo"></span>
    </header>
    <main id="main"></main>
  </div>
</div>

<div id="toast" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
